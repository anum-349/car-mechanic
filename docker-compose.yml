name: gaaridoc

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  static-init:
    image: alpine:3.23
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /static && chown -R 10001:10001 /static"]
    volumes:
      - static-data:/static
    restart: "no"

  api:
    image: ${API_IMAGE:-gaaridoc-api:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env.production.example
        required: true
    environment:
      SECRET_KEY: ${SECRET_KEY:-}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DB_NAME: ${POSTGRES_DB:-}
      DB_USER: ${POSTGRES_USER:-}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      ALLOW_DRAFT_CONTENT: ${ALLOW_DRAFT_CONTENT:-False}
      LAUNCH_MIN_FLOWS: ${LAUNCH_MIN_FLOWS:-3}
      RUN_LAUNCH_CHECK: ${RUN_LAUNCH_CHECK:-1}
      ADMIN_URL: ${ADMIN_URL:-}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-True}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-True}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-31536000}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-True}
      SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-True}
      SECURE_REFERRER_POLICY: ${SECURE_REFERRER_POLICY:-strict-origin-when-cross-origin}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-False}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-False}
      OUTCOME_REMINDER_EXTERNAL_ENABLED: ${OUTCOME_REMINDER_EXTERNAL_ENABLED:-False}
      ALLOW_SELF_APPROVAL: ${ALLOW_SELF_APPROVAL:-False}
      ENGINE_CONFIDENCE_THRESHOLD: ${ENGINE_CONFIDENCE_THRESHOLD:-0.70}
      ENGINE_MIN_GAP: ${ENGINE_MIN_GAP:-0.20}
      ENGINE_MAX_QUESTIONS: ${ENGINE_MAX_QUESTIONS:-8}
      ENGINE_LEAK_LIKELIHOOD: ${ENGINE_LEAK_LIKELIHOOD:-0.05}
      ENGINE_BAND_VERY_LIKELY: ${ENGINE_BAND_VERY_LIKELY:-0.80}
      ENGINE_BAND_LIKELY: ${ENGINE_BAND_LIKELY:-0.50}
      ENGINE_BAND_POSSIBLE: ${ENGINE_BAND_POSSIBLE:-0.20}
      SCAMSHIELD_PLAUSIBLE_THRESHOLD: ${SCAMSHIELD_PLAUSIBLE_THRESHOLD:-0.65}
      SCAMSHIELD_DOUBTFUL_THRESHOLD: ${SCAMSHIELD_DOUBTFUL_THRESHOLD:-0.35}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    volumes:
      - static-data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      static-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  worker:
    image: ${API_IMAGE:-gaaridoc-api:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env.production.example
        required: true
    environment:
      SECRET_KEY: ${SECRET_KEY:-}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DB_NAME: ${POSTGRES_DB:-}
      DB_USER: ${POSTGRES_USER:-}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      ALLOW_DRAFT_CONTENT: ${ALLOW_DRAFT_CONTENT:-False}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    entrypoint: ["celery"]
    command: ["-A", "config.celery:app", "worker", "--loglevel=INFO"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    image: ${API_IMAGE:-gaaridoc-api:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env.production.example
        required: true
    environment:
      SECRET_KEY: ${SECRET_KEY:-}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      DB_NAME: ${POSTGRES_DB:-}
      DB_USER: ${POSTGRES_USER:-}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      ALLOW_DRAFT_CONTENT: ${ALLOW_DRAFT_CONTENT:-False}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    entrypoint: ["celery"]
    command: ["-A", "config.celery:app", "beat", "--loglevel=INFO"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:-gaaridoc-web:local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      ADMIN_URL: ${ADMIN_URL:-}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    volumes:
      - static-data:/usr/share/nginx/static:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  static-data:
