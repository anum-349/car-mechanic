load_module /usr/lib/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /usr/lib/nginx/modules/ngx_http_brotli_static_module.so;

worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format safe '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent"';
    access_log /dev/stdout safe;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 3m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript application/manifest+json
                application/xml image/svg+xml text/css text/plain text/xml;

    brotli on;
    brotli_comp_level 5;
    brotli_static on;
    brotli_types application/json application/javascript application/manifest+json
                  application/xml image/svg+xml text/css text/plain text/xml;

    client_body_temp_path /var/lib/nginx/tmp/client_body;
    proxy_temp_path /var/lib/nginx/tmp/proxy;
    fastcgi_temp_path /var/lib/nginx/tmp/fastcgi;
    uwsgi_temp_path /var/lib/nginx/tmp/uwsgi;
    scgi_temp_path /var/lib/nginx/tmp/scgi;

    include /etc/nginx/http.d/*.conf;
}
